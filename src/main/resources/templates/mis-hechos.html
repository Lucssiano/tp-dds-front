<div th:replace="fragments/header :: header"></div>
<main>
    <section class="all-collections">
        <div class="container">
            <h1 class="page-title">Mis Hechos</h1>

<!--            <p class="page-subtitle"-->
<!--               th:text="${usuarioEmail != null} ?-->
<!--                        'Estos son los hechos que has subido con el usuario ' + ${usuarioEmail} :-->
<!--                        'Hechos asociados a tu cuenta.'">-->
<!--                Estos son los hechos que has subido.-->
<!--            </p>-->

            <!-- Mensaje de error global -->
            <div th:if="${errorGlobal}" class="alert alert--error">
                <p th:text="${errorGlobal}"></p>
            </div>

            <!-- Grid de hechos -->
            <div class="card-grid" th:if="${not #lists.isEmpty(hechos)}">
                <div class="card" th:each="hecho : ${hechos}">
                    <div class="card__content">
                        <div style="margin-bottom: 10px;">
                <span class="estado-badge"
                      th:classappend="'estado-' + ${hecho.estado}"
                      th:text="${hecho.estado}">
                    PENDIENTE
                </span>
                        </div>

                        <h3 class="card__title" th:text="${hecho.titulo}">Título del hecho</h3>

                        <p class="card__description" th:text="${hecho.descripcion}">
                            Descripción del hecho.
                        </p>

                        <p class="card__meta">
                <span th:if="${hecho.fechaHecho != null}">
                    <strong>Fecha: </strong>
                    <span th:text="${#temporals.format(hecho.fechaHecho, 'yyyy-MM-dd HH:mm')}">01/01/2024</span>
                </span>
                            <br/>
                            <span th:if="${hecho.categoria != null}">
                    <strong>Categoría: </strong>
                    <span th:text="${hecho.categoria}">Categoría</span>
                </span>
                        </p>

                        <div style="margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap;">
                            <a th:href="@{|/hechos/${hecho.id}/detalle|}" class="card__link">
                                Ver Detalle
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Si no hay hechos -->
            <div th:if="${#lists.isEmpty(hechos)}">
                <p class="page-subtitle">
                    Aún no has subido ningún hecho. Puedes empezar desde
                    <a th:href="@{/hechos/subir-hecho}">Subir Hecho</a>.
                </p>
            </div>
        </div>
    </section>
</main>

<div th:replace="fragments/footer :: footer"></div>

</body>
</html>

<style>
    /* Estilo base para la etiqueta */
    .estado-badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 0.85rem;
        font-weight: bold;
        color: white; /* Texto blanco por defecto */
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    /* Colores según el estado (coinciden con el nombre del ENUM) */

    /* VERDE para ACEPTADO */
    .estado-ACEPTADO {
        background-color: #28a745;
    }

    /* ROJO para RECHAZADO */
    .estado-RECHAZADO {
        background-color: #dc3545;
    }

    /* AMARILLO/NARANJA para PENDIENTE */
    .estado-PENDIENTE {
        background-color: #ffc107;
        color: #333; /* Texto oscuro para que se lea bien sobre amarillo */
    }
</style>
