<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Hecho Modificado</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
<div class="admin-layout">
    <aside class="sidebar">
        <a th:href="@{/}" class="logo">MetaMapa Admin</a>
        <nav class="sidebar__nav">
            <a th:href="@{/admin/dashboard}" class="sidebar__link">Dashboard</a>
            <a th:href="@{/admin/colecciones}" class="sidebar__link">Colecciones</a>
            <a th:href="@{/admin/revisiones}" class="sidebar__link sidebar__link--active">Revisiones</a>
        </nav>
        <a th:href="@{/auth/logout}" class="btn btn--secondary sidebar__logout">Cerrar Sesión</a>
    </aside>

    <div class="main-content">

        <h1 class="page-title">Detalle del Hecho</h1>

        <div class="stat-card" style="padding: 30px;">


            <h2 class="section-title" th:text="${solicitudModificacion.hechoTitulo}"></h2>

            <!-- DESCRIPCIÓN -->
            <div class="content-block">
                <h3 class="content-title">Descripción</h3>
                <p th:text="${solicitudModificacion.hechoDescripcion}"></p>
            </div>

            <!-- CATEGORÍA -->
            <div class="content-block">
                <h3 class="content-title">Categoría</h3>
                <p th:text="${solicitudModificacion.hechoCategoria}"></p>
            </div>

            <!-- FECHA -->
            <div class="content-block">
                <h3 class="content-title">Fecha del Hecho</h3>
                <p th:text="${#temporals.format(solicitudModificacion.fechaHecho, 'yyyy-MM-dd HH:mm:ss')}"></p>
            </div>

            <!-- UBICACIÓN -->
            <div class="content-block">
                <h3 class="content-title">Ubicación</h3>
                <table class="data-table" style="max-width: 700px;">
                    <tbody>
                    <tr>
                        <th>Latitud</th>
                        <td th:text="${solicitudModificacion.hechoLatitud}"></td>
                    </tr>
                    <tr>
                        <th>Longitud</th>
                        <td th:text="${solicitudModificacion.hechoLongitud}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- MAPA -->
            <div style="margin-top: 20px;">
                <h3 class="content-title">Mapa</h3>
                <div id="map-preview" style="height: 400px; border-radius: 4px; margin-top: 10px; max-width: 1000px"></div>
            </div>

            <!-- BOTONES ABAJO -->
            <div style="margin-top: 30px; display: flex; gap: 10px; justify-content: center;">
                <form th:action="@{/admin/revisiones/modificaciones/{id}/aprobar(id=${solicitudModificacion.id})}" method="post">
                    <button class="btn btn--primary">Aprobar</button>
                </form>

                <form th:action="@{/admin/revisiones/modificaciones/{id}/rechazar(id=${solicitudModificacion.id})}" method="post">
                    <button class="btn btn--third" onclick="return confirm('¿Rechazar este hecho?')">Rechazar</button>
                </form>
            </div>

        </div>
    </div>
</div>

<!-- SCRIPTS LEAFLET -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>

<script>
    /* Mapa inicial centrado en la ubicación */
    const latInicial = /*[[${solicitudModificacion.hechoLatitud}]]*/ -34.6037;
    const lngInicial = /*[[${solicitudModificacion.hechoLongitud}]]*/ -58.3816;

    const map = L.map('map-preview').setView([latInicial, lngInicial], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    L.marker([latInicial, lngInicial]).addTo(map);
</script>

</body>
</html>
