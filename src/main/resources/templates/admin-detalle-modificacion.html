<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Solicitud de Modificación</title>

    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/hecho.css}">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
</head>

<body>
<div class="admin-layout">
    <aside class="sidebar">
        <a th:href="@{/}" class="logo">MetaMapa Admin</a>
        <nav class="sidebar__nav">
            <a th:href="@{/admin/dashboard}" class="sidebar__link">Dashboard</a>
            <a th:href="@{/admin/colecciones}" class="sidebar__link">Colecciones</a>
            <a th:href="@{/admin/revisiones}" class="sidebar__link sidebar__link--active">Revisiones</a>
        </nav>
        <a th:href="@{/auth/logout}" class="btn btn--secondary sidebar__logout">Cerrar Sesión</a>
    </aside>

    <div class="main-content">
        <div class="detail-container">

            <h1 class="page-title">Revisión de Solicitud de Modificación</h1>

            <div th:if="${mensaje}" class="api-success-alert mb-2">
                <span th:text="${mensaje}"></span>
            </div>

            <div class="stat-card">

                <div style="margin-bottom: 20px;">
                    <h1 class="section-title" th:text="${solicitudModificacion.hechoTitulo}">Título del Hecho</h1>
                </div>

                <div class="content-block">
                    <h3 class="content-title">Descripción</h3>
                    <p th:text="${solicitudModificacion.hechoDescripcion}"></p>
                </div>

                <div class="content-block">
                    <h3 class="content-title">Categoría</h3>
                    <p th:text="${solicitudModificacion.hechoCategoria}"></p>
                </div>

                <div class="content-block">
                    <h3 class="content-title">Fecha del Hecho</h3>
                    <p th:text="${#temporals.format(solicitudModificacion.fechaHecho, 'dd/MM/yyyy HH:mm')}"></p>
                </div>

                <div class="content-block">
                    <h3 class="content-title">Ubicación (Coordenadas)</h3>
                    <table class="detail-table" style="max-width: 400px;">
                        <tbody>
                        <tr>
                            <th>Latitud</th>
                            <td th:text="${solicitudModificacion.hechoLatitud}"></td>
                        </tr>
                        <tr>
                            <th>Longitud</th>
                            <td th:text="${solicitudModificacion.hechoLongitud}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="content-block" style="border-bottom: none; padding-bottom: 0; margin-bottom: 0;">
                    <h3 class="content-title">Ubicación en mapa</h3>
                    <div id="map-preview" style="height: 400px; border-radius: 8px;"></div>
                </div>

                <div class="form-actions">
                    <form th:action="@{/admin/revisiones/modificaciones/{id}/aprobar(id=${solicitudModificacion.id})}" method="post">
                        <button class="btn btn--primary">Aprobar Modificación</button>
                    </form>

                    <form th:action="@{/admin/revisiones/modificaciones/{id}/rechazar(id=${solicitudModificacion.id})}" method="post">
                        <button class="btn btn--third" onclick="return confirm('¿Rechazar esta solicitud?')">Rechazar Solicitud</button>
                    </form>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>

<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function() {
        // Aseguramos que la latitud y longitud no sean nulas antes de inicializar
        const latInicial = /*[[${solicitudModificacion.hechoLatitud}]]*/ -34.6037;
        const lngInicial = /*[[${solicitudModificacion.hechoLongitud}]]*/ -58.3816;

        if (document.getElementById('map-preview') && latInicial != null && lngInicial != null) {
            const map = L.map('map-preview').setView([latInicial, lngInicial], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            L.marker([latInicial, lngInicial]).addTo(map).bindPopup("Ubicación Modificada").openPopup();
        }
    });
</script>

</body>
</html>
