<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Colección - MetaMapa Admin</title>
  <link rel="stylesheet" th:href="@{/css/global.css}">
  <link rel="stylesheet" th:href="@{/css/admin.css}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
<div class="admin-layout">
  <aside class="sidebar">
    <a th:href="@{/}" class="logo">MetaMapa Admin</a>
    <nav class="sidebar__nav">
      <a th:href="@{/admin/dashboard}" class="sidebar__link">Dashboard</a>
      <a th:href="@{/admin/colecciones}" class="sidebar__link sidebar__link--active">Colecciones</a>
      <a th:href="@{/admin/revisiones}" class="sidebar__link">Revisiones</a>
    </nav>
    <a th:href="@{/auth/logout}" class="btn btn--secondary sidebar__logout">Cerrar Sesión</a>
  </aside>

  <main class="main-content">
    <h1 class="page-title">Crear Nueva Colección</h1>

    <div class="alert alert-danger" th:if="${errors != null and !errors.isEmpty()}">
      <ul>
        <li th:each="err : ${errors}" th:text="${err.value}"></li>
      </ul>
    </div>

    <form th:action="@{/admin/colecciones/crear}" th:object="${coleccion}" method="post" class="form-card">

      <!-- Título -->
      <div class="form-group">
        <label for="titulo">Título</label>
        <input type="text" id="titulo" th:field="*{titulo}" placeholder="Ej: Eventos Naturales de Argentina" required class="form-control">
      </div>

      <!-- Descripción -->
      <div class="form-group">
        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" th:field="*{descripcion}" placeholder="Breve descripción de la colección" rows="4" required class="form-control"></textarea>
      </div>

      <!-- Fuentes -->
      <div class="form-group">
        <label>Fuentes Asociadas</label>

        <!-- Si NO hay fuentes -->
        <div th:if="${#lists.isEmpty(fuentesDisponibles)}" class="no-fuentes-msg">
          <p>No hay fuentes disponibles actualmente.</p>
        </div>

        <!-- Si hay fuentes -->
          <div th:unless="${#lists.isEmpty(fuentesDisponibles)}">
              <div class="checkbox-group" th:each="fuente : ${fuentesDisponibles}">
                  <label>
                      <input type="checkbox"
                             th:field="*{fuentesIds}"
                             th:value="${fuente.id}">
                      <span th:text="${fuente.nombre}">Nombre de fuente</span>
                  </label>
              </div>
              <small class="form-hint">Podés seleccionar varias fuentes.</small>
          </div>
      </div>

      <!-- Algoritmo de Consenso -->
      <div class="form-group">
        <label for="algoritmoConsenso">Algoritmo de Consenso</label>
        <select id="algoritmoConsenso" th:field="*{algoritmoConsenso}" class="form-control">
          <option value="">Seleccioná un algoritmo (opcional)</option>
          <option th:value="MULTIPLES_MENCIONES">Múltiples menciones</option>
          <option th:value="MAYORIA_SIMPLE">Mayoría simple</option>
          <option th:value="ABSOLUTA">Absoluta</option>
        </select>
      </div>

      <!-- Criterios de Pertenencia -->
      <div class="form-group">
        <label>Criterios de Pertenencia</label>

        <div id="criterios-container">
          <!-- Se agregan dinámicamente -->
        </div>

        <div class="text-danger" id="criterios-error" style="display:none;"></div>

        <button type="button" class="btn btn--secondary" onclick="agregarCriterio()">Agregar Criterio</button>
      </div>

      <!-- Acciones -->
      <div class="form-actions">
        <button type="submit" class="btn btn--primary">Crear Colección</button>
        <a th:href="@{/admin/colecciones}" class="btn btn--secondary">Cancelar</a>
      </div>
    </form>
  </main>
</div>

<!-- Validación frontend -->
<script>
  document.querySelector("form").addEventListener("submit", function(e) {

    // 1️⃣ Validar criterios de pertenencia
    const criterios = document.querySelectorAll(".criterio-item");
    const errorDiv = document.getElementById("criterios-error");

    if (criterios.length === 0) {
      e.preventDefault();
      errorDiv.textContent = "Debés agregar al menos un criterio de pertenencia.";
      errorDiv.style.display = "block";
      return;
    } else {
      errorDiv.style.display = "none";
    }

    // Validar parámetros de cada criterio
    for (const criterio of criterios) {
      // Buscamos el select del tipo de criterio
      const tipoSelect = criterio.querySelector("select[name*='tipoCriterio']");
      const tipo = tipoSelect ? tipoSelect.value : "";

      if (tipo === "FECHA") {
        const inicio = criterio.querySelector("input[name*='fechaInicio']").value;
        const fin = criterio.querySelector("input[name*='fechaFin']").value;
        if (!inicio || !fin) {
          e.preventDefault();
          errorDiv.textContent = "Debés completar ambas fechas en cada criterio de tipo FECHA.";
          errorDiv.style.display = "block";
          return;
        }
      }

      if (tipo === "CATEGORIA") {
        // Buscamos el Select de Categoría (validación para el nuevo dropdown)
        const catSelect = criterio.querySelector("select[name*='categoria']");

        // La validación es: Si existe el select Y su valor es la opción por defecto ("")
        if (catSelect && catSelect.value === "") {
          e.preventDefault();
          errorDiv.textContent = "Debés seleccionar una categoría válida.";
          errorDiv.style.display = "block";
          return;
        }
      }
    }

    // 2️⃣ Validar fuentes, solo si hay checkboxes
    const todasLasFuentes = document.querySelectorAll("input[name='fuentes']");
    if (todasLasFuentes.length > 0) {
      const seleccionadas = document.querySelectorAll("input[name='fuentes']:checked");
      if (seleccionadas.length === 0) {
        e.preventDefault();
        document.getElementById("fuentes-error").textContent = "Debés seleccionar al menos una fuente.";
        document.getElementById("fuentes-error").style.display = "block";
        return;
      } else {
        document.getElementById("fuentes-error").style.display = "none";
      }
    }
  });
</script>

<<!-- Script dinámico de agregar criterios -->
<script th:inline="javascript">
  let criterioIndex = 0;

  // 1. Obtenemos las categorías desde Java (Thymeleaf las inyecta aquí)
  /*[[${categoriasDisponibles}]]*/
  const categoriasBackend = [[${categoriasDisponibles}]] || [];

  function agregarCriterio() {
    const container = document.getElementById('criterios-container');

    const wrapper = document.createElement('div');
    wrapper.classList.add('criterio-item');
    wrapper.innerHTML = `
      <div class="form-subgroup">
        <label>Nombre del Criterio</label>
        <input type="text" name="criteriosDePertenencias[${criterioIndex}].nombreCriterio" placeholder="Ej: Filtro por Tema" class="form-control" required>
      </div>

      <div class="form-subgroup">
        <label>Tipo de Criterio</label>
        <select name="criteriosDePertenencias[${criterioIndex}].tipoCriterio" class="form-control" required onchange="actualizarParametros(this, ${criterioIndex})">
          <option value="">Seleccionar tipo</option>
          <option value="FECHA">Fecha</option>
          <option value="CATEGORIA">Categoría</option>
        </select>
      </div>

      <div id="parametros-${criterioIndex}" class="form-subgroup"></div>

      <button type="button" class="btn btn--danger btn--small" onclick="this.parentElement.remove()">Eliminar</button>
      <hr>
    `;
    container.appendChild(wrapper);
    criterioIndex++;
  }

  function actualizarParametros(select, index) {
    const tipo = select.value;
    const paramsContainer = document.getElementById(`parametros-${index}`);
    paramsContainer.innerHTML = "";

    if (tipo === "FECHA") {
      paramsContainer.innerHTML = `
            <label>Fecha mínima</label>
            <input type="date" name="criteriosDePertenencias[${index}].parametros[fechaInicio]" class="form-control" required>
            <label>Fecha máxima</label>
            <input type="date" name="criteriosDePertenencias[${index}].parametros[fechaFin]" class="form-control" required>
        `;
    } else if (tipo === "CATEGORIA") {

      // 2. Construimos el SELECT dinámico usando las categorías
      let optionsHtml = '<option value="">Seleccioná una categoría</option>';

      categoriasBackend.forEach(cat => {
        // Usamos 'nombre' o 'categoria' dependiendo de cómo esté mapeado tu CategoriaDTO
        let nombreCat = cat.nombre || cat.categoria || "Sin nombre";
        optionsHtml += `<option value="${nombreCat}">${nombreCat}</option>`;
      });

      // Insertamos el Select
      paramsContainer.innerHTML = `
            <label>Categoría</label>
            <select name="criteriosDePertenencias[${index}].parametros[categoria]" class="form-control" required>
                ${optionsHtml}
            </select>
        `;
    }
  }
</script>
</body>
</html>
