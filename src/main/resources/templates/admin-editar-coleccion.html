<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Colección - MetaMapa Admin</title>

    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/hecho.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        .autocomplete-create-item {
            color: var(--primary-color);
            font-weight: 600;
            display: none;
        }
        .autocomplete-wrapper { position: relative; }

        /* Estilo para botón deshabilitado */
        button:disabled {
            background-color: #cbd5e1 !important;
            color: #64748b !important;
            cursor: not-allowed;
            border-color: #cbd5e1 !important;
            transform: none !important;
            box-shadow: none !important;
        }
    </style>
</head>

<body>
<div class="admin-layout">
    <aside class="sidebar">
        <a th:href="@{/}" class="logo">MetaMapa Admin</a>
        <nav class="sidebar__nav">
            <a th:href="@{/admin/dashboard}" class="sidebar__link">Dashboard</a>
            <a th:href="@{/admin/colecciones}" class="sidebar__link sidebar__link--active">Colecciones</a>
            <a th:href="@{/admin/revisiones}" class="sidebar__link">Revisiones</a>
        </nav>
        <a th:href="@{/auth/logout}" class="btn btn--secondary sidebar__logout">Cerrar Sesión</a>
    </aside>

    <div class="main-content">
        <div class="detail-container">

            <h1 class="page-title">Gestión de Colecciones</h1>

            <div class="stat-card">

                <form id="main-form" th:action="@{/admin/colecciones/{id}/editar(id=${idColeccion})}" th:object="${coleccion}" method="post">

                    <div style="margin-bottom: 30px;">
                        <h1 class="section-title">Editar Colección</h1>
                    </div>

                    <div th:if="${globalError}" class="api-error-alert mb-2">
                        <strong th:text="${globalError}"></strong>
                    </div>

                    <div class="api-error-alert mb-2" th:if="${errors != null and !errors.isEmpty()}">
                        <ul style="margin: 0; padding-left: 20px;">
                            <li th:each="err : ${errors}" th:text="${err.value}"></li>
                        </ul>
                    </div>

                    <div class="content-block">
                        <label class="content-title" for="titulo">Título</label>
                        <input type="text" id="titulo" th:field="*{titulo}"
                               class="clean-input"
                               th:classappend="${errors != null and errors.containsKey('titulo')} ? 'input-error' : ''"
                               placeholder="Ej: Eventos Naturales de Argentina">
                        <span class="field-error-msg" th:if="${errors != null and errors.containsKey('titulo')}" th:text="${errors['titulo']}"></span>
                    </div>

                    <div class="content-block">
                        <label class="content-title" for="descripcion">Descripción</label>
                        <textarea id="descripcion" th:field="*{descripcion}"
                                  class="clean-input" rows="4"
                                  th:classappend="${errors != null and errors.containsKey('descripcion')} ? 'input-error' : ''"
                                  placeholder="Breve descripción de la colección"></textarea>
                        <span class="field-error-msg" th:if="${errors != null and errors.containsKey('descripcion')}" th:text="${errors['descripcion']}"></span>
                    </div>

                    <div class="content-block">
                        <label class="content-title">Fuentes Asociadas</label>

                        <div th:if="${#lists.isEmpty(fuentesDisponibles)}" class="input-warning-msg">No hay fuentes disponibles.</div>

                        <div th:unless="${#lists.isEmpty(fuentesDisponibles)}" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-top: 10px;">
                            <div th:each="fuente : ${fuentesDisponibles}" style="display: flex; align-items: center; gap: 8px;">
                                <input type="checkbox"
                                       th:field="*{fuentesIds}"
                                       th:value="${fuente.id}"
                                       th:id="${'fuente-' + fuente.id}"
                                       class="chk-fuente"
                                       style="width: 16px; height: 16px; cursor: pointer; accent-color: var(--primary-color);">
                                <label th:for="${'fuente-' + fuente.id}" th:text="${fuente.nombre}" style="cursor: pointer; color: #334155; font-weight: 500;"></label>
                            </div>
                        </div>
                        <span class="field-error-msg" th:if="${errors != null and errors.containsKey('fuentesIds')}" th:text="${errors['fuentesIds']}"></span>
                    </div>

                    <div class="content-block">
                        <label class="content-title" for="algoritmoConsenso">Algoritmo de Consenso</label>
                        <select id="algoritmoConsenso" th:field="*{algoritmoConsenso}" class="clean-input" style="background-color: white;">
                            <option value="">Seleccioná un algoritmo (opcional)</option>
                            <option th:value="MULTIPLES_MENCIONES">Múltiples menciones</option>
                            <option th:value="MAYORIA_SIMPLE">Mayoría simple</option>
                            <option th:value="ABSOLUTA">Absoluta</option>
                        </select>
                    </div>

                    <div class="content-block" style="border-bottom: none; padding-bottom: 0;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                            <label class="content-title" style="margin-bottom: 0;">Criterios de Pertenencia</label>
                            <button type="button" class="btn btn--small btn--secondary" onclick="agregarCriterio()">Agregar Criterio</button>
                        </div>

                        <div id="criterios-container">
                        </div>

                        <span class="field-error-msg" th:if="${errors != null and errors.containsKey('criteriosDePertenencias')}" th:text="${errors['criteriosDePertenencias']}"></span>
                    </div>

                    <div class="form-actions">
                        <button id="btn-submit" type="submit" class="btn btn--primary" disabled>Sin cambios</button>
                        <a th:href="@{/admin/colecciones/{id}/editar(id=${idColeccion})}" class="btn btn--third">Cancelar</a>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">

    // Datos backend
    /*[[${categoriasDisponibles}]]*/
    const categoriasBackend = [[${categoriasDisponibles}]] || [];

    /*[[${coleccion.criteriosDePertenencias}]]*/
    const criteriosExistentes = [[${coleccion.criteriosDePertenencias}]] || [];

    let criterioIndex = 0;
    let focusStates = {}; // Foco para teclados
    let initialState = null; // Estado inicial para comparación

    // --- DETECCIÓN DE CAMBIOS (LÓGICA NUEVA) ---

    // 1. Función auxiliar para leer el estado completo del formulario
    function getFormState() {
        const state = {
            titulo: document.getElementById('titulo').value,
            descripcion: document.getElementById('descripcion').value,
            algoritmo: document.getElementById('algoritmoConsenso').value,
            // Checkboxes de fuentes (ordenados para que siempre sea igual el array)
            fuentes: Array.from(document.querySelectorAll('.chk-fuente:checked')).map(c => c.value).sort(),
            // Criterios (leemos dinámicamente lo que hay en el DOM)
            criterios: []
        };

        // Recorremos cada tarjeta de criterio visible
        document.querySelectorAll('.criterio-card').forEach((card, idx) => {
            // Buscamos inputs dentro de esta tarjeta
            const nombreInput = card.querySelector('input[name*="nombreCriterio"]');
            const tipoSelect = card.querySelector('select[name*="tipoCriterio"]');
            const fechaInicio = card.querySelector('input[name*="fechaInicio"]');
            const fechaFin = card.querySelector('input[name*="fechaFin"]');
            const categoria = card.querySelector('input[name*="categoria"]');

            state.criterios.push({
                nombre: nombreInput ? nombreInput.value : '',
                tipo: tipoSelect ? tipoSelect.value : '',
                // Params opcionales
                pInicio: fechaInicio ? fechaInicio.value : '',
                pFin: fechaFin ? fechaFin.value : '',
                pCat: categoria ? categoria.value : ''
            });
        });

        return state;
    }

    // 2. Función de chequeo principal
    function checkChanges() {
        if (!initialState) return; // Aún no inicializado

        const currentState = getFormState();
        const submitBtn = document.getElementById('btn-submit');

        // Comparamos stringificados (forma fácil de comparar objetos profundos)
        const hasChanges = JSON.stringify(initialState) !== JSON.stringify(currentState);

        if (hasChanges) {
            submitBtn.disabled = false;
            submitBtn.innerText = "Guardar Cambios";
        } else {
            submitBtn.disabled = true;
            submitBtn.innerText = "Sin cambios";
        }
    }

    // --- FIN LÓGICA CAMBIOS ---


    // PRE-CARGA Y LISTENERS
    document.addEventListener('DOMContentLoaded', () => {
        // 1. Cargar criterios existentes
        if (criteriosExistentes && criteriosExistentes.length > 0) {
            criteriosExistentes.forEach(c => agregarCriterioUI(c));
        }

        // 2. CAPTURAR ESTADO INICIAL (Una vez que todo se renderizó)
        initialState = getFormState();

        // 3. Listener Global para inputs (Event Delegation)
        // Esto captura cambios en inputs fijos y dinámicos (título, checks, criterios nuevos)
        document.getElementById('main-form').addEventListener('input', checkChanges);
        document.getElementById('main-form').addEventListener('change', checkChanges);
    });

    // --- AGREGAR CRITERIO (Wrapper) ---
    function agregarCriterio() {
        agregarCriterioUI(null);
        checkChanges(); // Checkear cambio al agregar
    }

    // --- GENERACIÓN DE HTML (SIN INLINE STYLES) ---
    function agregarCriterioUI(data) {
        const container = document.getElementById('criterios-container');
        const wrapper = document.createElement('div');
        const idx = criterioIndex;

        wrapper.className = 'criterio-card'; // Clase definida en admin.css
        wrapper.id = `criterio-row-${idx}`;

        const nombreVal = data ? data.nombreCriterio : '';
        const tipoVal = data ? data.tipoCriterio : '';

        wrapper.innerHTML = `
            <button type="button" class="btn-delete-absolute" onclick="eliminarCriterio(${idx})" title="Eliminar">&times;</button>

            <div class="form-grid-2"> <div>
                    <label class="content-title" style="font-size: 0.8rem;">Nombre del Criterio</label>
                    <input type="text" name="criteriosDePertenencias[${idx}].nombreCriterio"
                           value="${nombreVal}"
                           placeholder="Ej: Filtro por Tema" class="clean-input">
                </div>
                <div>
                    <label class="content-title" style="font-size: 0.8rem;">Tipo de Criterio</label>
                    <select name="criteriosDePertenencias[${idx}].tipoCriterio"
                            class="clean-input"
                            id="select-tipo-${idx}"
                            onchange="actualizarParametros(this, ${idx})"
                            style="background: white;">
                        <option value="">Seleccionar tipo...</option>
                        <option value="FECHA" ${tipoVal === 'FECHA' ? 'selected' : ''}>Rango de Fechas</option>
                        <option value="CATEGORIA" ${tipoVal === 'CATEGORIA' ? 'selected' : ''}>Categoría Específica</option>
                    </select>
                </div>
            </div>

            <div id="parametros-${idx}"></div>
        `;

        container.appendChild(wrapper);

        // Cargar parámetros si es edición
        if (data && tipoVal) {
            actualizarParametros(document.getElementById(`select-tipo-${idx}`), idx, data.parametros);
        }

        criterioIndex++;
    }

    function eliminarCriterio(index) {
        const row = document.getElementById(`criterio-row-${index}`);
        if(row) row.remove();
        delete focusStates[index];
        checkChanges(); // Checkear cambio al eliminar
    }

    // --- ACTUALIZAR INPUTS ---
    function actualizarParametros(select, index, valores = {}) {
        const tipo = select.value;
        const paramsContainer = document.getElementById(`parametros-${index}`);
        paramsContainer.innerHTML = "";

        if (tipo === "FECHA") {
            const valInicio = valores['fechaInicio'] || '';
            const valFin = valores['fechaFin'] || '';

            paramsContainer.innerHTML = `
                <div class="form-grid-2">
                    <div>
                        <label class="content-title" style="font-size: 0.8rem;">Desde</label>
                        <input type="date" name="criteriosDePertenencias[${index}].parametros[fechaInicio]" value="${valInicio}" class="clean-input">
                    </div>
                    <div>
                        <label class="content-title" style="font-size: 0.8rem;">Hasta</label>
                        <input type="date" name="criteriosDePertenencias[${index}].parametros[fechaFin]" value="${valFin}" class="clean-input">
                    </div>
                </div>
            `;
        } else if (tipo === "CATEGORIA") {
            const valCat = valores['categoria'] || '';

            // Generar Opciones
            let opcionesHTML = "";
            categoriasBackend.forEach(cat => {
                const nombre = cat.nombre || cat.categoria || cat;
                opcionesHTML += `<li class="autocomplete-item" onclick="selectDynamicCat(${index}, '${nombre}')">${nombre}</li>`;
            });
            // Item "Crear nueva" oculto por defecto (usa clase .autocomplete-create-item)
            opcionesHTML += `<li id="no-results-${index}" class="autocomplete-item autocomplete-create-item" onclick="selectDynamicCat(${index}, document.getElementById('cat-input-${index}').value)"></li>`;

            paramsContainer.innerHTML = `
                <label class="content-title" style="font-size: 0.8rem;">Categoría</label>

                <div class="autocomplete-wrapper" id="cat-wrapper-${index}">
                    <input type="text"
                           id="cat-input-${index}"
                           name="criteriosDePertenencias[${index}].parametros[categoria]"
                           value="${valCat}"
                           class="clean-input"
                           placeholder="Escribe o selecciona..."
                           autocomplete="off"
                           oninput="filterDynamicCat(${index}); checkChanges();"
                           onfocus="showDynamicCat(${index})"
                           onkeydown="handleKeydown(${index}, event)">

                    <ul id="cat-list-${index}" class="autocomplete-list">
                        ${opcionesHTML}
                    </ul>
                </div>
            `;

            focusStates[index] = -1; // Inicializar foco
        }
        checkChanges(); // Checkear al cambiar tipo de param
    }

    // --- LOGICA AUTOCOMPLETE (Idéntica a Subir Hecho) ---

    // 1. Teclado
    window.handleKeydown = function(index, e) {
        const list = document.getElementById(`cat-list-${index}`);
        if (!list || !list.classList.contains('active')) return;

        let items = getVisibleItems(list);

        if (e.key === "ArrowDown") {
            focusStates[index]++;
            addActive(items, index);
        } else if (e.key === "ArrowUp") {
            focusStates[index]--;
            addActive(items, index);
        } else if (e.key === "Enter") {
            e.preventDefault();
            if (focusStates[index] > -1) {
                if (items[focusStates[index]]) items[focusStates[index]].click();
            } else if (items.length === 1 && items[0].id === `no-results-${index}`) {
                items[0].click(); // Enter en "Crear nueva"
            }
        } else if (e.key === "Escape") {
            closeDynamicList(index);
        }
    };

    function getVisibleItems(list) {
        const all = list.getElementsByTagName("li");
        let visible = [];
        for (let i = 0; i < all.length; i++) {
            if (all[i].style.display !== "none") visible.push(all[i]);
        }
        return visible;
    }

    function addActive(items, index) {
        if (!items || items.length === 0) return false;

        if (focusStates[index] >= items.length) focusStates[index] = 0;
        if (focusStates[index] < 0) focusStates[index] = (items.length - 1);

        removeActive(items);
        items[focusStates[index]].classList.add("autocomplete-active");
        items[focusStates[index]].scrollIntoView({ block: 'nearest' });
    }

    function removeActive(items) {
        for (let i = 0; i < items.length; i++) {
            items[i].classList.remove("autocomplete-active");
        }
    }

    // 2. Mouse / Input
    window.showDynamicCat = function(index) {
        const list = document.getElementById(`cat-list-${index}`);
        const input = document.getElementById(`cat-input-${index}`);
        if(list) {
            filterDynamicCat(index);
            list.classList.add('active');
            input.classList.add('dropdown-open');
        }
    };

    window.filterDynamicCat = function(index) {
        const input = document.getElementById(`cat-input-${index}`);
        const list = document.getElementById(`cat-list-${index}`);
        if(!input || !list) return;

        const filter = input.value.toLowerCase();
        const items = list.getElementsByTagName('li');
        let visibleCount = 0;

        focusStates[index] = -1;
        removeActive(items);

        for (let i = 0; i < items.length; i++) {
            const item = items[i];
            if (item.id === `no-results-${index}`) continue;

            const txtValue = item.textContent || item.innerText;
            if (txtValue.toLowerCase().indexOf(filter) > -1) {
                item.style.display = "";
                visibleCount++;
            } else {
                item.style.display = "none";
            }
        }

        const noResults = document.getElementById(`no-results-${index}`);
        if (visibleCount === 0 && filter !== '') {
            if(noResults) {
                noResults.style.display = "block";
                noResults.innerText = `Crear nueva: "${input.value}"`;
            }
        } else {
            if(noResults) noResults.style.display = "none";
        }

        list.classList.add('active');
    };

    window.selectDynamicCat = function(index, valor) {
        const input = document.getElementById(`cat-input-${index}`);
        input.value = valor;
        closeDynamicList(index);
        checkChanges(); // AGREGADO: Detectar cambio
    };

    function closeDynamicList(index) {
        const list = document.getElementById(`cat-list-${index}`);
        const input = document.getElementById(`cat-input-${index}`);
        if(list) list.classList.remove('active');
        if(input) input.classList.remove('dropdown-open');
        focusStates[index] = -1;
    }

    document.addEventListener('click', function(e) {
        const wrappers = document.querySelectorAll('.autocomplete-wrapper');
        wrappers.forEach(wrapper => {
            const idParts = wrapper.id.split('-');
            const index = idParts[idParts.length - 1];
            if (!wrapper.contains(e.target)) {
                closeDynamicList(index);
            }
        });
    });

</script>

</body>
</html>
