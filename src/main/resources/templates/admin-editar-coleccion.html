<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Colección - MetaMapa Admin</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
<div class="admin-layout">
    <aside class="sidebar">
        <a th:href="@{/}" class="logo">MetaMapa Admin</a>
        <nav class="sidebar__nav">
            <a th:href="@{/admin/dashboard}" class="sidebar__link">Dashboard</a>
            <a th:href="@{/admin/colecciones}" class="sidebar__link sidebar__link--active">Colecciones</a>
        </nav>
    </aside>

    <main class="main-content">
        <h1 class="page-title">Editar Colección</h1>

        <form th:action="@{/admin/colecciones/editar/{id}(id=${idColeccion})}" th:object="${coleccion}" method="post" class="form-card">

            <div class="form-group">
                <label for="titulo">Título</label>
                <input type="text" id="titulo" th:field="*{titulo}" class="form-control">
            </div>

            <div class="form-group">
                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" th:field="*{descripcion}" rows="4" class="form-control"></textarea>
            </div>

            <div class="form-group">
                <label>Fuentes Asociadas</label>

                <div class="checkbox-group"
                     th:each="fuente : ${fuentesDisponibles}">
                    <label>
                        <input type="checkbox"
                               th:field="*{fuentes}"
                               th:value="${fuente}">
                        <span th:text="${fuente}">Nombre de fuente</span>
                    </label>
                </div>

                <small class="form-hint">Podés seleccionar varias fuentes.</small>
            </div>


            <div class="form-group">
                <label for="algoritmoConsenso">Algoritmo de Consenso</label>
                <select id="algoritmoConsenso" th:field="*{algoritmoConsenso}" class="form-control">
                    <option value="">Seleccioná un algoritmo</option>
                    <option value="MULTIPLES_MENCIONES">Múltiples menciones</option>
                    <option value="MAYORIA_SIMPLE">Mayoría simple</option>
                    <option value="ABSOLUTA">Absoluta</option>
                </select>
            </div>

            <div class="form-group">
                <label>Criterios de Pertenencia</label>
                <div id="criterios-container" class="criterios-container">

                    <div th:each="criterio, stat : *{criteriosDePertenencias}" class="criterio-item">
                        <div class="form-subgroup">
                            <label>Nombre del Criterio</label>
                            <input type="text" th:field="*{criteriosDePertenencias[__${stat.index}__].nombreCriterio}" class="form-control" required>
                        </div>

                        <div class="form-subgroup">
                            <label>Tipo (No editable)</label>
                            <input type="text" th:value="${criterio.tipoCriterio}" class="form-control" disabled>
                            <input type="hidden" th:field="*{criteriosDePertenencias[__${stat.index}__].tipoCriterio}">
                        </div>

                        <div class="form-subgroup" th:if="${criterio.tipoCriterio == 'FECHA'}">
                            <label>Fecha Inicio</label>
                            <input type="date" th:field="*{criteriosDePertenencias[__${stat.index}__].parametros['fechaInicio']}" class="form-control">
                            <label>Fecha Fin</label>
                            <input type="date" th:field="*{criteriosDePertenencias[__${stat.index}__].parametros['fechaFinal']}" class="form-control">
                        </div>

                        <button type="button" class="btn btn--danger btn--small" onclick="this.parentElement.remove()">Eliminar</button>
                        <hr>
                    </div>

                </div>
                <button type="button" class="btn btn--secondary btn--small" onclick="agregarCriterio()">+ Agregar Nuevo Criterio</button>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn--primary">Guardar Cambios</button>
                <a th:href="@{/admin/colecciones}" class="btn btn--secondary">Cancelar</a>
            </div>
        </form>
    </main>
</div>

<script th:inline="javascript">
    /* Inicializamos el índice en base a cuántos elementos ya trajo el Backend */
    let criterioIndex = [[${coleccion.criteriosDePertenencias != null ? coleccion.criteriosDePertenencias.size() : 0}]];

    function agregarCriterio() {
        const container = document.getElementById('criterios-container');
        const wrapper = document.createElement('div');
        wrapper.classList.add('criterio-item');

        // Usamos criterioIndex para generar nombres únicos (ej: criteriosDePertenencias[5])
        wrapper.innerHTML = `
      <div class="form-subgroup">
        <label>Nombre del Criterio</label>
        <input type="text" name="criteriosDePertenencias[${criterioIndex}].nombreCriterio" placeholder="Nuevo criterio" class="form-control" required>
      </div>

      <div class="form-subgroup">
        <label>Tipo de Criterio</label>
        <select name="criteriosDePertenencias[${criterioIndex}].tipoCriterio" class="form-control" required onchange="actualizarParametros(this, ${criterioIndex})">
          <option value="">Seleccionar tipo</option>
          <option value="FECHA">Fecha</option>
          <option value="CATEGORIA">Categoría</option>
        </select>
      </div>

      <div id="parametros-${criterioIndex}" class="form-subgroup"></div>

      <button type="button" class="btn btn--danger btn--small" onclick="this.parentElement.remove()">Eliminar</button>
      <hr>
    `;
        container.appendChild(wrapper);
        criterioIndex++;
    }

    function actualizarParametros(select, index) {
        const tipo = select.value;
        const paramsContainer = document.getElementById(`parametros-${index}`);
        paramsContainer.innerHTML = "";

        if (tipo === "FECHA") {
            paramsContainer.innerHTML = `
        <label>Fecha mínima</label>
        <input type="date" name="criteriosDePertenencias[${index}].parametros[fechaInicio]" class="form-control">
        <label>Fecha máxima</label>
        <input type="date" name="criteriosDePertenencias[${index}].parametros[fechaFinal]" class="form-control">
      `;
        } else if (tipo === "CATEGORIA") {
            paramsContainer.innerHTML = `
        <label>Categoría</label>
        <input type="text" name="criteriosDePertenencias[${index}].parametros[categoria]" placeholder="Ej: Ambiental" class="form-control">
      `;
        }
    }
</script>
</body>
</html>
