<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Colección - MetaMapa Admin</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
<div class="admin-layout">
    <aside class="sidebar">
        <a th:href="@{/}" class="logo">MetaMapa Admin</a>
        <nav class="sidebar__nav">
            <a th:href="@{/admin/dashboard}" class="sidebar__link">Dashboard</a>
            <a th:href="@{/admin/colecciones}" class="sidebar__link sidebar__link--active">Colecciones</a>
            <a th:href="@{/admin/revisiones}" class="sidebar__link">Revisiones</a>
        </nav>
    </aside>

    <main class="main-content">
        <h1 class="page-title">Editar Colección</h1>

        <form th:action="@{/admin/colecciones/editar/{id}(id=${idColeccion})}"
              th:object="${coleccion}"
              method="post"
              class="form-card">

            <!-- TÍTULO -->
            <div class="form-group">
                <label for="titulo">Título</label>
                <input type="text" id="titulo" th:field="*{titulo}" class="form-control">
            </div>

            <!-- DESCRIPCIÓN -->
            <div class="form-group">
                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" th:field="*{descripcion}" rows="4" class="form-control"></textarea>
            </div>

            <!-- FUENTES (misma lógica que en crear, pero con las ya seleccionadas marcadas) -->
            <div class="form-group">
                <label>Fuentes Asociadas</label>

                <!-- Si NO hay fuentes -->
                <div th:if="${#lists.isEmpty(fuentesDisponibles)}" class="no-fuentes-msg">
                    <p>No hay fuentes disponibles actualmente.</p>
                </div>

                <!-- Si hay fuentes -->
                <div th:unless="${#lists.isEmpty(fuentesDisponibles)}">
                    <div class="checkbox-group"
                         th:each="fuente : ${fuentesDisponibles}">
                        <label>
                            <!-- Las que ya están en coleccion.fuentes aparecen tildadas solo con esto -->
                            <input type="checkbox"
                                   th:field="*{fuentesIds}"
                                   th:value="${fuente.id}">
                            <span th:text="${fuente.nombre}">Nombre de fuente</span>
                        </label>
                    </div>
                    <small class="form-hint">Podés seleccionar varias fuentes.</small>

                    <div id="fuentes-error" class="text-danger" style="display:none;"></div>

                </div>

            <!-- ALGORITMO CONSENSO -->
            <div class="form-group">
                <label for="algoritmoConsenso">Algoritmo de Consenso</label>
                <select id="algoritmoConsenso" th:field="*{algoritmoConsenso}" class="form-control">
                    <option value="">Seleccioná un algoritmo</option>
                    <option th:value="MULTIPLES_MENCIONES">Múltiples menciones</option>
                    <option th:value="MAYORIA_SIMPLE">Mayoría simple</option>
                    <option th:value="ABSOLUTA">Absoluta</option>
                </select>
            </div>

                <!-- CRITERIOS EXISTENTES (editar nombre + parámetros) -->
                <div class="form-group">
                    <label>Criterios de Pertenencia</label>
                    <div id="criterios-container" class="criterios-container">

                        <!-- CRITERIOS YA EXISTENTES DEL BACKEND -->
                        <div th:each="criterio, stat : *{criteriosDePertenencias}" class="criterio-item">

                            <!-- Nombre -->
                            <div class="form-subgroup">
                                <label>Nombre del Criterio</label>
                                <input type="text"
                                       th:field="*{criteriosDePertenencias[__${stat.index}__].nombreCriterio}"
                                       class="form-control"
                                       required>
                            </div>

                            <!-- Tipo editable -->
                            <div class="form-subgroup">
                                <label>Tipo de Criterio</label>
                                <select class="form-control"
                                        th:name="|criteriosDePertenencias[${stat.index}].tipoCriterio|"
                                        onchange="actualizarParametros(this, [[${stat.index}]])">

                                    <option value="">Seleccionar tipo</option>

                                    <option value="FECHA"
                                            th:selected="${criterio.tipoCriterio.name() == 'FECHA'}">
                                        Fecha
                                    </option>

                                    <option value="CATEGORIA"
                                            th:selected="${criterio.tipoCriterio.name() == 'CATEGORIA'}">
                                        Categoría
                                    </option>

                                </select>
                            </div>

                            <!-- Parámetros dinámicos -->
                            <div class="form-subgroup"
                                 th:id="|parametros-${stat.index}|">

                                <!-- FECHA -->
                                <div th:if="${criterio.tipoCriterio.name() == 'FECHA'}">
                                    <label>Fecha mínima</label>
                                    <input type="date"
                                           th:name="|criteriosDePertenencias[${stat.index}].parametros[fechaInicio]|"
                                           th:value="${criterio.parametros['fechaInicio']}"
                                           class="form-control">

                                    <label>Fecha máxima</label>
                                    <input type="date"
                                           th:name="|criteriosDePertenencias[${stat.index}].parametros[fechaFin]|"
                                           th:value="${criterio.parametros['fechaFin']}"
                                           class="form-control">
                                </div>

                                <!-- CATEGORIA -->
                                <div th:if="${criterio.tipoCriterio.name() == 'CATEGORIA'}">
                                    <label>Categoría</label>
                                    <select class="form-control"
                                            th:name="|criteriosDePertenencias[${stat.index}].parametros[categoria]|">

                                        <option value="">Seleccione una categoría</option>

                                        <option th:each="cat : ${categorias}"
                                                th:value="${cat.nombre}"
                                                th:text="${cat.nombre}"
                                                th:selected="${criterio.parametros['categoria'] == cat.nombre}">
                                        </option>

                                    </select>
                                </div>

                            </div>

                            <button type="button"
                                    class="btn btn-danger btn--small mt-2"
                                    onclick="eliminarCriterio(this)">
                                Eliminar
                            </button>

                            <hr>
                        </div>

                    </div>

                    <!-- Botón para agregar nuevos criterios -->
                    <button type="button"
                            class="btn btn--secondary btn--small"
                            onclick="agregarCriterio()">
                        + Agregar Nuevo Criterio
                    </button>

                    <div class="text-danger" id="criterios-error" style="display:none;"></div>
                </div>



            <!-- ACCIONES -->
            <div class="form-actions">
                <button type="submit" class="btn btn--primary">Guardar Cambios</button>
                <a th:href="@{/admin/colecciones}" class="btn btn--secondary">Cancelar</a>
            </div>
            </div>
        </form>
    </main>
</div>

<template id="opciones-categorias-template">
    <option value="">Seleccione una categoría</option>
    <option th:each="cat : ${categorias}"
            th:value="${cat.nombre}"
            th:text="${cat.nombre}">
    </option>
</template>

<script th:inline="javascript">
    /* Arrancamos desde la cantidad de criterios que ya vienen del backend */
    let criterioIndex = [[${coleccion.criteriosDePertenencias != null ? coleccion.criteriosDePertenencias.size() : 0}]];

    function agregarCriterio() {
        const container = document.getElementById('criterios-container');
        const wrapper = document.createElement('div');
        wrapper.classList.add('criterio-item');

        wrapper.innerHTML = `
          <div class="form-subgroup">
            <label>Nombre del Criterio</label>
            <input type="text"
                   name="criteriosDePertenencias[${criterioIndex}].nombreCriterio"
                   placeholder="Nuevo criterio"
                   class="form-control"
                   required>
          </div>

          <div class="form-subgroup">
            <label>Tipo de Criterio</label>
            <select name="criteriosDePertenencias[${criterioIndex}].tipoCriterio"
                    class="form-control"
                    required
                    onchange="actualizarParametros(this, ${criterioIndex})">
              <option value="">Seleccionar tipo</option>
              <option value="FECHA">Fecha</option>
              <option value="CATEGORIA">Categoría</option>
            </select>
          </div>

          <div id="parametros-${criterioIndex}" class="form-subgroup"></div>

          <button type="button"
                  class="btn btn--danger btn--small"
                  onclick="this.parentElement.remove()">
            Eliminar
          </button>
          <hr>
        `;

        container.appendChild(wrapper);
        criterioIndex++;
    }

    function actualizarParametros(select, index) {
        const tipo = select.value;
        const paramsContainer = document.getElementById(`parametros-${index}`);
        paramsContainer.innerHTML = "";

        if (tipo === "FECHA") {
            paramsContainer.innerHTML = `
                <label>Fecha mínima</label>
                <input type="date"
                       name="criteriosDePertenencias[${index}].parametros[fechaInicio]"
                       class="form-control">
                <label>Fecha máxima</label>
                <input type="date"
                       name="criteriosDePertenencias[${index}].parametros[fechaFin]"
                       class="form-control">
            `;
        } else if (tipo === "CATEGORIA") {
            const opciones = document.getElementById('opciones-categorias-template').innerHTML;

            paramsContainer.innerHTML = `
        <label>Categoría</label>
        <select name="criteriosDePertenencias[${index}].parametros[categoria]"
                class="form-control">
            ${opciones}
        </select>
    `;
        }
    }

    function eliminarCriterio(btn) {
        btn.parentElement.remove();
        reindexarCriterios();
    }

    function reindexarCriterios() {
        const items = document.querySelectorAll('.criterio-item');

        items.forEach((item, index) => {
            // Actualizar atributos name
            item.querySelectorAll('[name]').forEach(el => {
                el.name = el.name.replace(/criteriosDePertenencias\[\d+\]/, `criteriosDePertenencias[${index}]`);
            });

            // Actualizar id de los parámetros
            const params = item.querySelector('[id^="parametros-"]');
            if (params) {
                params.id = `parametros-${index}`;
            }

            // Actualizar el onchange del select tipoCriterio
            const selectTipo = item.querySelector('select[name$=".tipoCriterio"]');
            if (selectTipo) {
                selectTipo.setAttribute("onchange", `actualizarParametros(this, ${index})`);
            }
        });

        // Actualizar el índice global
        criterioIndex = items.length;
    }
</script>

</body>
</html>
