<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuentes - MetaMapa Admin</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
<div class="admin-layout">
    <aside class="sidebar">
        <a th:href="@{/static}" class="logo">MetaMapa Admin</a>
        <nav class="sidebar__nav">
            <a th:href="@{/admin/dashboard}" class="sidebar__link">Dashboard</a>
            <a th:href="@{/admin/colecciones}" class="sidebar__link">Colecciones</a>
            <a th:href="@{/admin/fuentes}" class="sidebar__link sidebar__link--active">Fuentes</a>
            <a th:href="@{/admin/revisiones}" class="sidebar__link">Revisiones</a>
        </nav>
        <a th:href="@{/auth/logout}" class="btn btn--secondary sidebar__logout">Cerrar Sesión</a>
    </aside>

    <main class="main-content">
        <h1 class="page-title">Gestión de Fuentes</h1>

        <!-- Mensajes de feedback -->
        <div th:if="${mensaje}" class="alert alert--success" th:text="${mensaje}"></div>
        <div th:if="${error}" class="alert alert--danger" th:text="${error}"></div>

<!--        <div class="content-header">-->
<!--            &lt;!&ndash; Botón que lleva a la página de creación &ndash;&gt;-->
<!--            <a th:href="@{/admin/fuentes/crear}" class="btn btn&#45;&#45;primary">Crear Nueva Fuente</a>-->
<!--        </div>-->

        <div class="table-container">
            <table class="data-table">
                <thead>
                <tr>
                    <th>Nombre de la fuente</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="fuente : ${fuentesDisponibles}">
                    <td th:text="${fuente}">Nombre Fuente</td>
                </tr>

                <tr th:if="${#lists.isEmpty(fuentesDisponibles)}">
                    <td colspan="1" style="text-align: center;">No hay fuentes registradas.</td>
                </tr>
                </tbody>
            </table>
        </div>

    </main>
</div>
</body>
</html>
